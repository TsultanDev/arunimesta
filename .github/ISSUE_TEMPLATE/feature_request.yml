name: Feature request
description: Suggest a new API, module, or engine capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Arunimesta. For large changes, please discuss the design here before opening a pull request. See the [roadmap](https://github.com/TsultanDev/arunimesta/blob/main/docs/roadmap.md) for planned work.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build / CMake
        - aru (entry point / facade)
        - aru.window
        - aru.rhi
        - Rendering / swapchain
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or difficult to do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like. A short code sketch is very helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer this one.

  - type: textarea
    id: scope
    attributes:
      label: Scope and ownership
      description: Which modules/docs would change? Are you willing to implement it?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap for this idea.
          required: true
        - label: I understand the project targets Windows x64 with C++23 modules.
          required: true
